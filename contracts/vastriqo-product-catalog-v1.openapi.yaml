      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProjectionRebuildCommand' }
      responses:
        '202': { $ref: '#/components/responses/OperationAccepted' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }

components:
  securitySchemes:
    AdminSession:
      type: http
      scheme: bearer
      bearerFormat: OpaqueAdminSession
      description: Server-to-server opaque admin session supplied by the same-origin admin BFF.

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    VariantId:
      name: variantId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    CollectionId:
      name: collectionId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    MediaId:
      name: mediaId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    RunId:
      name: runId
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Uuid' }
    ProductHandle:
      name: handle
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Handle' }
    CollectionSlug:
      name: slug
      in: path
      required: true
      schema: { $ref: '#/components/schemas/Handle' }
    SearchQuery:
      name: q
      in: query
      schema: { type: string, maxLength: 200 }
    ClassificationFilter:
      name: classification
      in: query
      style: form
      explode: true
      schema: { type: array, items: { type: string, pattern: '^[a-z0-9]+(?:_[a-z0-9]+)*$' } }
    SizeFilter:
      name: size
      in: query
      style: form
      explode: true
      schema: { type: array, items: { type: string, minLength: 1, maxLength: 160 } }
    ColorFilter:
      name: color
      in: query
      style: form
      explode: true
      schema: { type: array, items: { type: string, minLength: 1, maxLength: 160 } }
    AudienceFilter:
      name: audience
      in: query
      style: form
      explode: true
      schema: { type: array, items: { type: string, minLength: 1, maxLength: 100 } }
    MinPrice:
      name: minPrice
      in: query
      schema: { $ref: '#/components/schemas/DecimalAmount' }
    MaxPrice:
      name: maxPrice
      in: query
      schema: { $ref: '#/components/schemas/DecimalAmount' }
    Currency:
      name: currency
      in: query
      schema: { $ref: '#/components/schemas/CurrencyCode' }
    AvailabilityFilter:
      name: availability
      in: query
      schema: { type: string, enum: [all, available, sold_out], default: all }
    ProductSort:
      name: sort
      in: query
      schema: { type: string, enum: [recommended, newest, price_asc, price_desc] }
    PublicLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 24 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 2048 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong quoted decimal aggregate version, for example `"12"`.
      schema: { type: string, pattern: '^"[0-9]+"$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, format: uuid }

  requestBodies:
    EmptyCommand:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false }
    ReasonCommand:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [reason]
            properties:
              reason: { type: string, minLength: 1, maxLength: 500 }

  responses:
    AdminProductOk:
      description: Updated/current admin Product
      headers:
        ETag: { required: true, schema: { type: string, pattern: '^"[0-9]+"$' } }
        X-Correlation-ID: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminProduct' }
    AdminProductCreated:
      description: Product or Product-owned resource created
      headers:
        ETag: { required: true, schema: { type: string, pattern: '^"[0-9]+"$' } }
        Location: { required: true, schema: { type: string, format: uri-reference } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminProduct' }
    AdminCollectionOk:
      description: Current/updated admin Collection
      headers:
        ETag: { required: true, schema: { type: string, pattern: '^"[0-9]+"$' } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AdminCollection' }
    OperationAccepted:
      description: Asynchronous operation accepted
      headers:
        Location: { required: true, schema: { type: string, format: uri-reference } }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Operation' }
    BadRequestProblem:
      description: Malformed request or invalid cursor
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ValidationProblem:
      description: Field or aggregate validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFoundProblem:
      description: Requested visible/authorized resource was not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ConflictProblem:
      description: Unique, lifecycle, idempotency, mapping, or aggregate conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    StaleVersionProblem:
      description: If-Match version is stale
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/StaleVersionProblem' }
    PreconditionRequiredProblem:
      description: Required If-Match header is missing
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    UnauthorizedProblem:
      description: Admin session is absent or invalid
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ForbiddenProblem:
      description: Admin lacks the operation permission
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    RateLimitedProblem:
      description: Rate limit exceeded
      headers:
        Retry-After: { schema: { type: integer, minimum: 1 } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    DependencyProblem:
      description: A transient external dependency operation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Uuid:
      type: string
      format: uuid
    Version:
      type: string
      pattern: '^[0-9]+$'
      examples: ['12']
    Handle:
      type: string
      minLength: 1
      maxLength: 160
      pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
    DecimalAmount:
      type: string
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'
      examples: ['1299.00']
    CurrencyCode:
      type: string
      pattern: '^[A-Z]{3}$'
      examples: [INR]
    Money:
      type: object
      additionalProperties: false
      required: [amount, currency]
      properties:
        amount: { $ref: '#/components/schemas/DecimalAmount' }
        currency: { $ref: '#/components/schemas/CurrencyCode' }
    Availability:
      type: string
      enum: [available, sold_out]
    ProductPublicationStatus:
      type: string
      enum: [draft, published, retired]
    VariantStatus:
      type: string
      enum: [active, retired]
    InventoryMode:
      type: string
      enum: [tracked, not_tracked]
    OversellPolicy:
      type: string
      enum: [deny, continue]
    ClassificationSummary:
      type: object
      additionalProperties: false
      required: [id, code, name]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 120 }
    PublicMedia:
      type: object
      additionalProperties: false
      required: [id, url, altText, role, position, featured]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        url: { type: string, format: uri, pattern: '^https://' }
        altText: { type: string, minLength: 1, maxLength: 500 }
        role: { type: string, enum: [gallery, card_override] }
        position: { type: integer, minimum: 0 }
        featured: { type: boolean }
    OptionValue:
      type: object
      additionalProperties: false
      required: [id, value, position]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        value: { type: string, minLength: 1, maxLength: 160 }
        position: { type: integer, minimum: 0 }
    ProductOption:
      type: object
      additionalProperties: false
      required: [id, code, name, position, values]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        code: { type: string, minLength: 1, maxLength: 64 }
        name: { type: string, minLength: 1, maxLength: 120 }
        position: { type: integer, minimum: 0 }
        values:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/OptionValue' }
    VariantSelection:
      type: object
      additionalProperties: false
      required: [optionId, optionValueId, optionCode, optionName, value]
      properties:
        optionId: { $ref: '#/components/schemas/Uuid' }
        optionValueId: { $ref: '#/components/schemas/Uuid' }
        optionCode: { type: string }
        optionName: { type: string }
        value: { type: string }
    ProductVariant:
      type: object
      additionalProperties: false
      required: [id, title, position, selections, price, availability]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        title: { type: [string, 'null'], maxLength: 240 }
        position: { type: integer, minimum: 0 }
        selections: { type: array, items: { $ref: '#/components/schemas/VariantSelection' } }
        price:
          description: This Variant's price.
          $ref: '#/components/schemas/Money'
        availability: { $ref: '#/components/schemas/Availability' }
    SpecificationValue:
      type: object
      additionalProperties: false
      required: [value, position]
      properties:
        value: { type: string, minLength: 1 }
        position: { type: integer, minimum: 0 }
    ProductSpecification:
      type: object
      additionalProperties: false
      required: [code, label, position, values]
      properties:
