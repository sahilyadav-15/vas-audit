      required: [items, pageInfo]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ImportRecord' } }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
    ProjectionRebuildCommand:
      type: object
      additionalProperties: false
      required: [scope, productIds]
      properties:
        scope: { type: string, enum: [all, product_ids] }
        productIds: { type: array, maxItems: 1000, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
    Operation:
      type: object
      additionalProperties: false
      required: [id, type, state, createdAt]
      properties:
        id: { $ref: '#/components/schemas/Uuid' }
        type: { type: string, enum: [product_projection_rebuild, catalog_projection_rebuild] }
        state: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
        createdAt: { type: string, format: date-time }
    ProblemField:
      type: object
      additionalProperties: false
      required: [path, code, message]
      properties:
        path: { type: string }
        code: { type: string }
        message: { type: string }
    Problem:
      type: object
      additionalProperties: true
      required: [type, title, status, detail, instance, code, correlationId, retryable]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, pattern: '^[A-Z0-9_]+$' }
        correlationId: { type: string }
        retryable: { type: boolean }
        errors: { type: array, items: { $ref: '#/components/schemas/ProblemField' } }
    StaleVersionProblem:
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          required: [currentVersion, current]
          properties:
            currentVersion: { $ref: '#/components/schemas/Version' }
            current:
              type: object
              additionalProperties: false
              required: [id, updatedAt]
              properties:
                id: { $ref: '#/components/schemas/Uuid' }
                updatedAt: { type: string, format: date-time }
                updatedBy: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
