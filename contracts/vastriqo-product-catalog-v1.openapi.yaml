openapi: 3.1.0
info:
  title: Vastriqo Product/Catalog API
  version: 1.0.0-design
  description: |
    Normative Phase 2B Product/Catalog HTTP contract. This is a design artifact,
    not a deployed API. Examples are synthetic and are not production evidence.
servers:
  - url: https://api.vastriqo.in/api/v1
    description: Illustrative production origin; deployment is not configured by Phase 2B.
tags:
  - name: Public Catalog
  - name: Public Collections
  - name: Admin Products
  - name: Admin Collections
  - name: Admin Media
  - name: Admin Imports
  - name: Admin Repair

paths:
  /catalog/products:
    get:
      tags: [Public Catalog]
      operationId: listPublicProducts
      summary: List, search, filter, facet, and sort published Products
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/ClassificationFilter'
        - $ref: '#/components/parameters/SizeFilter'
        - $ref: '#/components/parameters/ColorFilter'
        - $ref: '#/components/parameters/AudienceFilter'
        - $ref: '#/components/parameters/MinPrice'
        - $ref: '#/components/parameters/MaxPrice'
        - $ref: '#/components/parameters/Currency'
        - $ref: '#/components/parameters/AvailabilityFilter'
        - $ref: '#/components/parameters/ProductSort'
        - $ref: '#/components/parameters/PublicLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Complete filtered result page and full-result facets
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        '400': { $ref: '#/components/responses/BadRequestProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '429': { $ref: '#/components/responses/RateLimitedProblem' }

  /catalog/products/{handle}:
    get:
      tags: [Public Catalog]
      operationId: getPublicProductByHandle
      summary: Get a complete published Product by canonical handle
      parameters:
        - $ref: '#/components/parameters/ProductHandle'
      responses:
        '200':
          description: Complete Product detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductDetail' }
        '308':
          description: Handle is an active alias; redirect to canonical API URL
          headers:
            Location:
              required: true
              schema: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '429': { $ref: '#/components/responses/RateLimitedProblem' }

  /catalog/products/{productId}/related:
    get:
      tags: [Public Catalog]
      operationId: listRelatedProducts
      summary: List published Products sharing published Collections
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 12, default: 8 }
      responses:
        '200':
          description: Ordered, deduplicated related Products
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductCardPage' }
        '400': { $ref: '#/components/responses/BadRequestProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /catalog/collections:
    get:
      tags: [Public Collections]
      operationId: listPublicCollections
      summary: List published Collection metadata
      parameters:
        - $ref: '#/components/parameters/PublicLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Published Collection page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CollectionPage' }
        '400': { $ref: '#/components/responses/BadRequestProblem' }

  /catalog/collections/{slug}:
    get:
      tags: [Public Collections]
      operationId: getPublicCollection
      summary: Get published Collection metadata
      parameters:
        - $ref: '#/components/parameters/CollectionSlug'
      responses:
        '200':
          description: Published Collection
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Collection' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /catalog/collections/{slug}/products:
    get:
      tags: [Public Collections]
      operationId: listPublicCollectionProducts
      summary: List ordered published Products in a published Collection
      parameters:
        - $ref: '#/components/parameters/CollectionSlug'
        - $ref: '#/components/parameters/PublicLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Ordered Product page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductListResponse' }
        '400': { $ref: '#/components/responses/BadRequestProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /catalog/sitemap/products:
    get:
      tags: [Public Catalog]
      operationId: listSitemapProducts
      summary: List published Product sitemap entries or an update delta
      parameters:
        - name: updatedAfter
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/PublicLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sitemap Product page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SitemapProductPage' }
        '400': { $ref: '#/components/responses/BadRequestProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }

  /admin/products:
    get:
      tags: [Admin Products]
      operationId: listAdminProducts
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:read]
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - name: publicationStatus
          in: query
          schema: { $ref: '#/components/schemas/ProductPublicationStatus' }
        - $ref: '#/components/parameters/ClassificationFilter'
        - $ref: '#/components/parameters/AvailabilityFilter'
        - $ref: '#/components/parameters/PublicLimit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Admin Product page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminProductPage' }
        '400': { $ref: '#/components/responses/BadRequestProblem' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
    post:
      tags: [Admin Products]
      operationId: createAdminProduct
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProductCommand' }
      responses:
        '201':
          $ref: '#/components/responses/AdminProductCreated'
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }

  /admin/products/{productId}:
    get:
      tags: [Admin Products]
      operationId: getAdminProduct
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:read]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200': { $ref: '#/components/responses/AdminProductOk' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /admin/products/{productId}/preview:
    get:
      tags: [Admin Products]
      operationId: previewAdminProduct
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:read]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      responses:
        '200':
          description: Non-public preview and validation state
          headers:
            ETag: { required: true, schema: { type: string, pattern: '^"[0-9]+"$' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductPreview' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /admin/products/{productId}/content:
    patch:
      tags: [Admin Products]
      operationId: updateProductContent
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProductContentCommand' }
      responses:
        '200': { $ref: '#/components/responses/AdminProductOk' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '412': { $ref: '#/components/responses/StaleVersionProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '428': { $ref: '#/components/responses/PreconditionRequiredProblem' }

  /admin/products/{productId}/handle-changes:
    post:
      tags: [Admin Products]
      operationId: changeProductHandle
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeHandleCommand' }
      responses:
        '200': { $ref: '#/components/responses/AdminProductOk' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/StaleVersionProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '428': { $ref: '#/components/responses/PreconditionRequiredProblem' }

  /admin/products/{productId}/options:
    put:
      tags: [Admin Products]
      operationId: replaceProductOptions
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceOptionsCommand' }
      responses:
        '200': { $ref: '#/components/responses/AdminProductOk' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/StaleVersionProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '428': { $ref: '#/components/responses/PreconditionRequiredProblem' }

  /admin/products/{productId}/variants:
    post:
      tags: [Admin Products]
      operationId: createProductVariant
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVariantCommand' }
      responses:
        '201': { $ref: '#/components/responses/AdminProductCreated' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/StaleVersionProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '428': { $ref: '#/components/responses/PreconditionRequiredProblem' }

  /admin/products/{productId}/variants/{variantId}:
    patch:
      tags: [Admin Products]
      operationId: updateProductVariant
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateVariantCommand' }
      responses:
        '200': { $ref: '#/components/responses/AdminProductOk' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }
        '409': { $ref: '#/components/responses/ConflictProblem' }
        '412': { $ref: '#/components/responses/StaleVersionProblem' }
        '422': { $ref: '#/components/responses/ValidationProblem' }
        '428': { $ref: '#/components/responses/PreconditionRequiredProblem' }

  /admin/products/{productId}/variants/order:
    put:
      tags: [Admin Products]
      operationId: reorderProductVariants
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderIdsCommand' }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/variants/{variantId}/selections:
    put:
      tags: [Admin Products]
      operationId: replaceVariantSelections
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceSelectionsCommand' }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/variants/{variantId}/price:
    put:
      tags: [Admin Products]
      operationId: updateVariantPrice
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePriceCommand' }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/variants/{variantId}/inventory-policy:
    put:
      tags: [Admin Products]
      operationId: updateVariantInventoryPolicy
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateInventoryPolicyCommand' }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/variants/{variantId}/retirement:
    post:
      tags: [Admin Products]
      operationId: retireProductVariant
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReasonCommand' }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/media:
    post:
      tags: [Admin Media]
      operationId: attachProductMedia
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:media]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AttachMediaCommand' }
      responses: { '201': { $ref: '#/components/responses/AdminProductCreated' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/media/order:
    put:
      tags: [Admin Media]
      operationId: reorderProductMedia
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:media]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mediaIds]
              properties:
                mediaIds: { type: array, minItems: 1, uniqueItems: true, items: { $ref: '#/components/schemas/Uuid' } }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/media/{mediaId}/featured:
    put:
      tags: [Admin Media]
      operationId: featureProductMedia
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:media]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/card-media:
    put:
      tags: [Admin Media]
      operationId: setProductCardMedia
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:media]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mediaId]
              properties:
                mediaId: { anyOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/media/{mediaId}/retirement:
    post:
      tags: [Admin Media]
      operationId: retireProductMedia
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:media]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/MediaId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/ReasonCommand' }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '404': { $ref: '#/components/responses/NotFoundProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/specifications:
    put:
      tags: [Admin Products]
      operationId: replaceProductSpecifications
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:write]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceSpecificationsCommand' }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

  /admin/products/{productId}/publication-validations:
    post:
      tags: [Admin Products]
      operationId: validateProductPublication
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:read]
      parameters: [{ $ref: '#/components/parameters/ProductId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Complete publication blockers and warnings; no state change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicationValidation' }
        '401': { $ref: '#/components/responses/UnauthorizedProblem' }
        '403': { $ref: '#/components/responses/ForbiddenProblem' }
        '404': { $ref: '#/components/responses/NotFoundProblem' }

  /admin/products/{productId}/publish:
    post:
      tags: [Admin Products]
      operationId: publishProduct
      security: [{ AdminSession: [] }]
      x-permissions: [catalog:publish]
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody: { $ref: '#/components/requestBodies/EmptyCommand' }
      responses: { '200': { $ref: '#/components/responses/AdminProductOk' }, '401': { $ref: '#/components/responses/UnauthorizedProblem' }, '403': { $ref: '#/components/responses/ForbiddenProblem' }, '409': { $ref: '#/components/responses/ConflictProblem' }, '412': { $ref: '#/components/responses/StaleVersionProblem' }, '422': { $ref: '#/components/responses/ValidationProblem' }, '428': { $ref: '#/components/responses/PreconditionRequiredProblem' } }

